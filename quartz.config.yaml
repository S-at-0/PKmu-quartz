# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
# Migrated from old_Project/quartz.config.ts and quartz.layout.ts (Quartz v4).
configuration:
  pageTitle: "Personal Knowledge μονσική"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: ja-JP
  baseUrl: "www.warabi.ne.jp/~s_at_0/PKμ"
  ignorePatterns:
    - _/**
    - SrcBarn
    - _事地/手形/_PKμ
    - _事地/手形/_券契
    - .obsidian
    - .git*
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: "Courier New"
      body: "Klee One"
      code: "JetBrains Mono"
    colors:
      lightMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: "rgba(143, 159, 169, 0.15)"
        textHighlight: "#b3aa0288"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: "rgba(143, 159, 169, 0.15)"
        textHighlight: "#b3aa0288"
plugins:
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties: [description, tags, aliases]
      excludedProperties: []
      hidePropertiesView: false
      delimiters: "---"
      language: yaml
    order: 5
    layout: { position: beforeBody, priority: 15, display: all }
  - source:
      name: japanese-frontmatter
      repo: "./plugins/japanese-frontmatter"
    enabled: true
    order: 6
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority: [frontmatter, git, filesystem]
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme: { light: github-light, dark: github-dark }
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options: { enableInHtmlEmbed: true, enableCheckbox: true }
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout: { position: right, priority: 30 }
  - source: "@quartz-community/crawl-links"
    enabled: true
    options: { markdownLinkResolution: shortest, prettyLinks: false }
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options: { renderEngine: katex }
    order: 80
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false
    options: { theme: tokyo-night, mode: both }
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options: { enableSiteMap: true, enableRSS: false }
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: false
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: false


  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout: { position: left, priority: 50 }
  - source: "@quartz-community/graph"
    enabled: true
    layout: { position: right, priority: 10 }
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions: { grow: true }
  - source: "@quartz-community/backlinks"
    enabled: true
    layout: { position: right, priority: 50 }
  - source: "@quartz-community/article-title"
    enabled: true
    layout: { position: beforeBody, priority: 10 }
  - source: "@quartz-community/content-meta"
    enabled: true
    layout: { position: beforeBody, priority: 20 }
  - source: "@quartz-community/tag-list"
    enabled: true
    layout: { position: beforeBody, priority: 30 }
  - source: "@quartz-community/page-title"
    enabled: false
    layout: { position: left, priority: 10 }
  - source:
      name: page-title-brand
      repo: "./plugins/page-title-brand"
    enabled: true
    layout: { position: left, priority: 10 }
  - source: "@quartz-community/darkmode"
    enabled: true
    layout: { position: left, priority: 30, group: toolbar }
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout: { position: left, priority: 35, group: toolbar }
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout: { position: beforeBody, priority: 5, condition: not-index }
  - source: "@quartz-community/comments"
    enabled: true
    options:
      provider: giscus
      options:
        repo: "S-at-0/PKmu-quartz"
        repoId: "R_kgDOULnYeg"
        category: Announcements
        categoryId: "DIC_kwDOULnYes4DEtBF"
        themeUrl: "https://giscus.app/themes"
        mapping: title
        strict: false
        lightTheme: transparent_dark
        darkTheme: transparent_dark
        lang: ja
    layout: { position: afterBody, priority: 10 }
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: "https://github.com/jackyzha0/quartz"
        Discord Community: "https://discord.gg/cRFFHYye7t"
    layout: { position: footer, priority: 50 }
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout: { position: left, priority: 25, display: mobile-only }
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout: { position: afterBody, priority: 50, display: all }
layout:
  groups:
    toolbar: { priority: 35, direction: row, gap: 0.5rem }
  byPageType:
    "404": { positions: { beforeBody: [], left: [], right: [] } }
    content: {}
    folder: { exclude: [reader-mode], positions: { right: [] } }
    tag: { exclude: [reader-mode], positions: { right: [] } }
    canvas: {}
    bases: {}
